<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B5E7C" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<title>Painel de Saúde</title>
<style>
  /* Direção "Mar": quatro campos de cor, uma onda, uma régua e uma boia. O resto é tipografia.
     Cantos retos, réguas de 2px, nenhum emoji na interface. */
  :root {
    --campo: #0B5E7C; --onda: #0E7396; --sol: #FFB48F; --tinta: #071C26;
    --fundo: #F1F6F8; --branco: #FFFFFF; --sec: #44565F; --fraca: #C4D3DA;
    --curva: cubic-bezier(0.2, 0.8, 0.2, 1);
    --display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #D9E4E9; }
  body { margin: 0; color: var(--tinta); font: 16px/1.45 'Figtree', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--fundo);
    padding-bottom: calc(76px + env(safe-area-inset-bottom)); overflow-x: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* campo principal */
  .campo { background: var(--campo); color: var(--branco); overflow: hidden; }
  .campo.tinta { background: var(--tinta); }
  .campo .dentro { padding: 20px 22px 0; display: flex; flex-direction: column; gap: 14px; }
  .rot { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .selo { border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  h1.titulo { margin: 0; font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 0.98; letter-spacing: -0.03em; }
  h1.titulo.longo { font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; }
  .campo .sub { font-size: 15px; line-height: 1.4; }
  .linha-dagua { height: 30px; margin-top: 18px; overflow: hidden; }
  .linha-dagua svg { display: block; animation: onda 14s linear infinite; }

  /* faixa de dias */
  .dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 2px solid var(--tinta); }
  .dias a { min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; font-size: 11.5px; font-weight: 600; color: var(--sec); border-left: 1px solid var(--fraca); }
  .dias a:first-child { border-left: 0; }
  .dias a b { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--tinta); line-height: 1.1; }
  .dias a.on { background: var(--sol); color: var(--tinta); }
  .dias a.hoje b::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 99px; background: var(--tinta); margin: 2px auto 0; }

  /* blocos e linhas */
  .bloco { padding: 22px 22px 0; animation: sobe 0.45s var(--curva) both; }
  .bloco + .bloco { animation-delay: 0.06s; }
  .cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--tinta); }
  h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1.1; }
  .cab small { font-size: 13px; font-weight: 600; color: var(--sec); text-align: right; }
  .linha { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--fraca); min-height: 52px; }
  button.linha { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--fraca); text-align: left; cursor: pointer; }
  a.linha { text-decoration: none; }
  .hora { flex: none; width: 58px; font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.1; }
  .corpo { flex: 1 1 auto; min-width: 0; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
  .corpo small { display: block; font-size: 13px; font-weight: 500; color: var(--sec); margin-top: 1px; }
  .num { flex: none; font-family: var(--display); font-weight: 800; font-size: 21px; white-space: nowrap; }
  .num small { font-family: 'Figtree', sans-serif; font-size: 12px; font-weight: 600; color: var(--sec); }
  .nota { padding: 10px 0 12px 34px; font-size: 14px; color: var(--sec); border-bottom: 1px solid var(--fraca); }
  .par { padding: 10px 0; border-bottom: 1px solid var(--fraca); font-size: 15px; line-height: 1.45; }
  .par:last-child { border-bottom: 0; }

  /* boia */
  .boia { flex: none; width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--tinta);
    display: flex; align-items: center; justify-content: center; transition: background 0.3s ease, border-color 0.3s ease; }
  .boia.feito { background: var(--campo); border-color: var(--campo); }
  .boia svg { opacity: 0; transition: opacity 0.3s ease; }
  .boia.feito svg { opacity: 1; }

  /* régua de maré */
  .regua { position: relative; height: 26px; margin: 0 10px; }
  .regua .eixo { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: currentColor; }
  .regua .riscos { position: absolute; left: 0; right: 0; top: 5px; bottom: 5px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .regua .riscos i { border-left: 1px solid currentColor; }
  .regua .riscos i:first-child, .regua .riscos i:nth-child(6) { border-left-width: 2px; }
  .regua .riscos i:last-child { border-right: 2px solid currentColor; }
  .regua .marca { position: absolute; top: 3px; width: 20px; height: 20px; margin-left: -10px; border-radius: 999px;
    background: var(--sol); border: 2px solid currentColor; transition: left 1s var(--curva); }
  .regua .alvo { position: absolute; top: 2px; bottom: 2px; background: currentColor; }
  .legenda { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; padding-top: 5px; }

  .barra { position: relative; height: 14px; background: var(--fraca); }
  .barra > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--campo); transition: width 0.6s var(--curva); }
  .barra > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--tinta); }

  /* campos de dado */
  .sol { background: var(--sol); color: var(--tinta); padding: 18px 22px; }
  .escuro { background: var(--tinta); color: var(--branco); padding: 20px 22px 18px; }
  .gigante { font-family: var(--display); font-weight: 800; font-size: 112px; line-height: 0.88; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .grande { font-family: var(--display); font-weight: 800; font-size: 60px; line-height: 0.95; letter-spacing: -0.04em; }
  .medio { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .medio small, .gigante small { font-family: 'Figtree', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; }
  .colunas { position: relative; height: 96px; display: grid; gap: 5px; align-items: end; }
  .colunas button { border: 0; padding: 0; background: var(--sol); min-height: 2px; transform-origin: bottom; cursor: pointer;
    animation: cresce 0.6s var(--curva) both; }
  .colunas button.on { background: var(--branco); }
  .colunas .ref { position: absolute; left: 0; right: 0; height: 1px; background: var(--branco); pointer-events: none; }

  /* quadro de números e prontidão de 7 dias */
  .quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quad > div { padding: 12px 0 12px; border-bottom: 1px solid var(--fraca); }
  .quad > div:nth-child(odd) { padding-right: 12px; border-right: 1px solid var(--fraca); }
  .quad > div:nth-child(even) { padding-left: 14px; }
  .quad .k { font-size: 13px; font-weight: 600; color: var(--sec); }
  .quad .d { font-size: 12px; font-weight: 500; color: var(--sec); }
  .pront { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; padding-top: 14px; }
  .pcol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .pval { font-family: var(--display); font-weight: 800; font-size: 16px; }
  .ptrilho { position: relative; width: 100%; height: 104px; background: var(--fraca); }
  .ptrilho i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--campo); transform-origin: bottom; animation: cresce 0.6s var(--curva) both; }
  .ptrilho b { position: absolute; left: -3px; right: -3px; height: 3px; background: var(--tinta); }
  .pdia { font-size: 11.5px; font-weight: 600; color: var(--sec); }
  svg.graf { display: block; width: 100%; height: auto; overflow: visible; }

  details.rel .par { font-size: 15.5px; line-height: 1.55; }
  /* cardápio da semana */
  .cardapio { display: grid; grid-template-columns: minmax(0, 1fr); }
  .cdia { border-bottom: 1px solid var(--fraca); }
  .cdia summary { gap: 12px; }
  .cdia summary .corpo small { display: block; }
  .cdia summary .hora { width: 72px; white-space: nowrap; }
  .cdia.hoje summary .hora { background: var(--sol); padding: 3px 6px; margin-left: -6px; width: 78px; }
  .crow { display: flex; gap: 10px; padding: 6px 0; font-size: 14.5px; line-height: 1.35; }
  .crow .slot { flex: none; width: 58px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sec); padding-top: 2px; }
  .crow .oque { flex: 1 1 auto; min-width: 0; }
  .crow .g { flex: none; font-family: var(--display); font-weight: 800; font-size: 15px; white-space: nowrap; }
  @media (min-width: 720px) { .cardapio { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; } }

  /* glifos */
  .glifo { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .glifo.g-campo { background: var(--campo); color: var(--branco); }
  .glifo.g-sol { background: var(--sol); color: var(--tinta); }
  .glifo.g-tinta { background: var(--tinta); color: var(--branco); }
  .glifo.g-vazio { border: 2px solid var(--tinta); color: var(--tinta); }

  /* ações e formulários */
  .botao { width: 100%; min-height: 56px; border: 0; background: var(--tinta); color: var(--branco); padding: 0 20px; cursor: pointer;
    font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.01em;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; }
  .botao:disabled { opacity: 0.55; }
  .botao.claro { background: transparent; color: var(--tinta); border: 2px solid var(--tinta); min-height: 46px; font-size: 15px; justify-content: center; }
  .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid var(--tinta); margin-top: 14px; }
  .seg button { min-height: 46px; border: 0; border-left: 2px solid var(--tinta); background: transparent; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 4px; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--sol); font-weight: 700; }
  .form { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .form label, .redit label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  input[type=date], select, textarea { width: 100%; min-height: 48px; padding: 10px 12px; border: 2px solid var(--tinta); border-radius: 0;
    background: var(--branco); color: var(--tinta); font: inherit; font-size: 16px; }
  textarea { min-height: 96px; resize: vertical; }
  .photo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filebtn { display: inline-flex !important; align-items: center; min-height: 46px; padding: 0 16px; border: 2px solid var(--tinta); cursor: pointer;
    font-size: 14px !important; letter-spacing: 0 !important; text-transform: none !important; margin: 0 !important; }
  .filebtn input { display: none; }
  #rg-prev { display: none; max-width: 120px; max-height: 120px; border: 2px solid var(--tinta); }
  .status { font-size: 14px; font-weight: 600; min-height: 20px; }
  .status.ok { color: #0A5A3C; } .status.err { color: #8C1D12; }
  .aviso { margin-top: 16px; padding: 12px 0; border-top: 1px solid var(--fraca); font-size: 13.5px; color: var(--sec); line-height: 1.45; }
  .rdays { display: flex; gap: 8px; margin-top: 16px; }
  .rdays button { min-height: 44px; padding: 0 14px; border: 2px solid var(--tinta); background: transparent; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .rdays button.on { background: var(--sol); font-weight: 700; }
  .ritem { padding: 12px 0; border-bottom: 1px solid var(--fraca); }
  .rhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .rd { font-weight: 700; } .rk { color: var(--sec); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .rtxt { font-size: 14.5px; margin: 4px 0 8px; color: var(--sec); }
  .ract { display: flex; gap: 8px; }
  .ract button { min-height: 44px; padding: 0 14px; border: 2px solid var(--tinta); background: transparent; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .ract button.cheio { background: var(--tinta); color: var(--branco); }
  .redit { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

  details { border-bottom: 1px solid var(--fraca); }
  details summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 15px; font-weight: 700; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; font-family: var(--display); font-weight: 800; font-size: 22px; }
  details[open] summary::after { content: "–"; }
  details .miolo { padding-bottom: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--fraca); font-weight: 500; }
  th { font-weight: 700; }
  .compra label { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--fraca); font-size: 15px; cursor: pointer; min-height: 44px; }
  .compra input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--campo); }
  .compra input:checked + span { color: var(--sec); text-decoration: line-through; }
  .cat { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 16px 0 4px; }
  .rodape { padding: 22px; font-size: 12.5px; color: var(--sec); font-weight: 500; }

  /* abas de navegação — NÃO chamar de .barra: esse nome é da régua de proteína (14 px de altura) e as duas regras se somavam */
  nav.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
  nav.abas .dentro { pointer-events: auto; width: 100%; max-width: 520px; background: var(--fundo); border-top: 2px solid var(--tinta);
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom); }
  nav.abas a { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    text-decoration: none; font-size: 12px; font-weight: 600; border-left: 2px solid var(--tinta); }
  nav.abas a:first-child { border-left: 0; }
  nav.abas a { background: var(--branco); color: var(--tinta); }
  nav.abas a.on { background: var(--sol); font-weight: 700; }
  nav.abas a.acao { background: var(--tinta); color: var(--branco); }

  /* Tela larga: as abas voltam para o topo, sempre à vista, e a coluna ganha largura. */
  @media (min-width: 720px) {
    .app { max-width: 760px; padding-bottom: 48px; }
    nav.abas { position: sticky; top: 0; bottom: auto; }
    nav.abas .dentro { max-width: 760px; border-top: 0; border-bottom: 2px solid var(--tinta); padding-bottom: 0; }
    nav.abas a { flex-direction: row; gap: 9px; font-size: 15px; min-height: 54px; }
  }

  @keyframes onda { from { transform: translateX(0); } to { transform: translateX(-390px); } }
  @keyframes sobe { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes cresce { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes desenha { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes pulso { 0% { transform: scale(1); opacity: 0.75; } 100% { transform: scale(2.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<nav class="abas"><div class="dentro" id="nav"></div></nav>
<div class="app"><div id="view"></div></div>

<script>
let DATA = null, REGISTROS = [], DASH = null, FATOS = null;
const $ = id => document.getElementById(id);
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// O semana.json vem cheio de emoji (é escrito para o Telegram também). A interface não usa nenhum:
// eles saem na hora de desenhar, e o dado continua intacto.
const semEmoji = s => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{20E3}\u{200D}]/gu, '')
  .replace(/\s{2,}/g, ' ').replace(/^[\s·—:-]+/, '').trim();
const T = s => esc(semEmoji(s));
const isoDDMM = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const hojeDDMM = () => { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
// Data LOCAL, não UTC: a conversão para ISO em UTC devolve o dia de amanhã depois das 21h no
// Brasil (UTC−3), e era isso que fazia o registro da noite nascer com a data errada.
const isoLocal = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fNum = (v, c = 1) => v == null ? '—' : Number(v).toFixed(c).replace('.', ',');
const dData = t => { const [y, m, d] = t.split('-').map(Number); return new Date(y, m - 1, d); };
const fDia = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
const dataLonga = t => { const d = dData(t); return d.getDate() + ' de ' + ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][d.getMonth()] + ' de ' + d.getFullYear(); };

const ICO = {
  mais: '<path d="M12 5v14M5 12h14"/>',
  visto: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  hoje: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>',
  semana: '<rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  casa: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  evo: '<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>',
  sono: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  pulso: '<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  vfc: '<path d="M4 14c3-7 5-7 8 0s5 7 8 0"/>',
};
const ico = (n, tam = 22, esp = 2.2) => `<svg aria-hidden="true" width="${tam}" height="${tam}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${esp}" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`;
// Quatro períodos de 390 px: a onda desliza um período e ainda cobre a coluna mais larga (760 px).
const ONDA = `<div class="linha-dagua"><svg aria-hidden="true" width="1560" height="30" viewBox="0 0 1560 30" preserveAspectRatio="none"><path d="M0 15 C 65 0, 130 0, 195 15 S 325 30, 390 15 S 520 0, 585 15 S 715 30, 780 15 S 910 0, 975 15 S 1105 30, 1170 15 S 1300 0, 1365 15 S 1495 30, 1560 15 V30 H0 Z" fill="var(--onda)"/></svg></div>`;
const REGUA_RISCOS = '<div class="riscos">' + '<i></i>'.repeat(10) + '</div>';

// ───────── tipo de dia → glifo ─────────
function tipoDoDia(d) {
  const f = ((d.treino && d.treino.foco) || '').toLowerCase();
  if (d.tipo === 'futebol' || /futebol|campeonato|\bjogo\b/.test(f)) return 'jogo';
  if (/recupera|descanso|vazio|descompress/.test(f)) return 'descanso';
  if (/lower|upper|costas|for[çc]a|academia|ombro|corpo inteiro/.test(f)) return 'forca';
  if (/corrida|esteira|\bkm\b|min f[áa]ceis/.test(f)) return 'corrida';
  if (d.tipo === 'treino') return 'forca';
  return 'leve';
}
const GLIFOS = {
  forca: ['g-campo', '<svg width="30" height="30" viewBox="0 0 40 40" fill="currentColor"><rect x="5" y="12" width="7" height="16"/><rect x="28" y="12" width="7" height="16"/><rect x="12" y="18" width="16" height="4"/></svg>', 'Força'],
  corrida: ['g-campo', '<svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"><path d="M9 11l9 9-9 9"/><path d="M21 11l9 9-9 9"/></svg>', 'Corrida'],
  jogo: ['g-sol', '<svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4"><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg>', 'Jogo'],
  leve: ['g-vazio', '<svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M5 22c5-8 10-8 15 0s10 8 15 0"/></svg>', 'Dia leve'],
  descanso: ['g-tinta', '<svg width="30" height="30" viewBox="0 0 40 40" fill="currentColor"><path d="M28 26a11 11 0 1 1-10-17 9 9 0 0 0 10 17z"/></svg>', 'Descanso'],
};
const glifo = d => { const g = GLIFOS[tipoDoDia(d)]; return `<span class="glifo ${g[0]}" role="img" aria-label="${g[2]}">${g[1]}</span>`; };

function frase(s) { s = semEmoji(s); if (s.length > 14 && s === s.toUpperCase()) s = s.charAt(0) + s.slice(1).toLowerCase(); return s; }
function partirFoco(foco) { const p = semEmoji(foco).split(/\s+—\s+/); return { titulo: frase(p[0]), sub: p.slice(1).join(' — ') }; }

function renderNav(ativo) {
  const it = (href, id, rot, icone, extra = '') => `<a href="${href}" class="${ativo === id ? 'on' : ''} ${extra}">${ico(icone)}<span>${rot}</span></a>`;
  $("nav").innerHTML = it('#home', 'home', 'Início', 'casa') + it('#hoje', 'hoje', 'Hoje', 'hoje') +
    it('#evo', 'evo', 'Evolução', 'evo') + it('#reg', 'reg', 'Registrar', 'mais', ativo === 'reg' ? '' : 'acao');
}
function faixaDias(ativoId) {
  const hoje = hojeDDMM();
  return '<div class="dias">' + DATA.dias.map(d =>
    `<a href="#${d.id}" class="${d.id === ativoId ? 'on' : ''} ${d.data === hoje ? 'hoje' : ''}" aria-label="${esc(d.nome)} ${esc(d.data)}"><span>${esc(d.nome.slice(0, 3))}</span><b>${esc(d.data.slice(0, 2))}</b></a>`).join('') + '</div>';
}

// ───────── o dia (Hoje e qualquer dia da semana) ─────────
const SLOTS = [['cafe', 'manhã', 'Café'], ['almoco', 'almoço', 'Almoço'], ['pre_lanche', 'tarde', 'Lanche'],
  ['lanche_pre_treino', 'pré', 'Lanche'], ['janta', 'janta', 'Jantar'], ['petisco', 'fim', 'Outro']];

function renderDia(d, ehHoje) {
  const [dd, mm] = d.data.split('/');
  const foco = partirFoco((d.treino && d.treino.foco) || d.cardio || 'Dia livre');
  const regs = (REGISTROS || []).filter(x => isoDDMM(x.data) === d.data);
  let h = `<div class="campo"><div class="dentro">
    <div class="topo"><div class="rot">${esc(d.nome)} · ${esc(dd)} ${MES[+mm - 1] || ''}</div><div class="selo">${ehHoje ? 'hoje' : esc(GLIFOS[tipoDoDia(d)][2].toLowerCase())}</div></div>
    <h1 class="titulo ${foco.titulo.length > 22 ? 'longo' : ''}">${esc(foco.titulo)}</h1>
    ${foco.sub ? `<div class="sub">${esc(foco.sub)}</div>` : ''}
  </div>${ONDA}</div>` + faixaDias(d.id);

  // treino: exercícios numerados viram linhas; o resto é contexto
  const ex = ((d.treino && d.treino.exercicios) || []).map(e => {
    const bruto = e.nome || '', k = bruto.match(/^\s*([0-9])️?⃣\s*/);
    return { num: k ? k[1] : null, txt: semEmoji(k ? bruto.slice(k[0].length) : bruto), series: e.series, reps: e.reps };
  }).filter(e => e.txt);
  const numerados = ex.filter(e => e.num), notas = ex.filter(e => !e.num);
  if (numerados.length) {
    h += `<section class="bloco"><div class="cab"><h2>A sessão</h2><small>séries × repetições</small></div>` +
      numerados.map(e => { const p = e.txt.split(/\s+—\s+/);
        return `<div class="linha"><span class="hora">${esc(e.num)}</span><span class="corpo">${esc(p[0])}${p[1] ? `<small>${esc(p.slice(1).join(' — '))}</small>` : ''}</span>
          <span class="num">${e.reps && e.reps !== '—' ? esc(e.series) + '×' + esc(e.reps) : ''}</span></div>`; }).join('') +
      (notas.length ? `<details><summary>Contexto do dia · ${notas.length} ${notas.length === 1 ? 'nota' : 'notas'}</summary><div class="miolo">${notas.map(n => `<div class="par">${esc(n.txt)}</div>`).join('')}</div></details>` : '') +
      `</section>`;
  } else if (notas.length) {
    h += `<section class="bloco"><div class="cab"><h2>O plano</h2></div>${notas.map(n => `<div class="par">${esc(n.txt)}</div>`).join('')}</section>`;
  }

  // refeições: a boia enche quando existe registro daquela refeição no dia
  const r = d.refeicoes || {}, resta = {};
  regs.filter(x => x.tipo === 'Refeição').forEach(x => { resta[x.refeicao] = (resta[x.refeicao] || 0) + 1; });
  let kcal = 0, prot = 0, n = 0, feitas = 0;
  const linhas = SLOTS.map(([chave, rot, ref], i) => {
    const m = r[chave]; if (!m) return '';
    n++; kcal += m.kcal || 0; prot += m.prot || 0;
    const feito = (resta[ref] || 0) > 0; if (feito) { resta[ref]--; feitas++; }
    let nome = semEmoji(m.nome), hora = rot;
    const t = nome.match(/^(~?\d{1,2}h\d{0,2}|\d{1,2}:\d{2})\s*·\s*/);
    if (t) { hora = t[1]; nome = nome.slice(t[0].length); }
    const nota = [m.origem ? semEmoji(m.origem) : '', m.nota ? semEmoji(m.nota) : ''].filter(Boolean).join(' ');
    return `<button type="button" class="linha refeicao" aria-expanded="false" data-n="${i}">
        <span class="boia ${feito ? 'feito' : ''}">${ico('visto', 12, 3.5).replace('currentColor', '#fff')}</span>
        <span class="hora">${esc(hora)}</span><span class="corpo">${esc(nome)}<small>${m.kcal} kcal${feito ? ' · registrado' : ''}</small></span>
        <span class="num">${m.prot}<small> g</small></span></button>
      ${nota ? `<div class="nota" id="nota-${i}" hidden>${esc(nota)}</div>` : ''}`;
  }).join('');
  if (n) {
    const meta = DATA.dieta.proteina, piso = DATA.dieta.proteina_piso;
    h += `<section class="bloco"><div class="cab"><h2>O dia</h2><small>proteína</small></div>${linhas}
      <div style="padding-top:16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
          <div style="font-size:14px;color:var(--sec);font-weight:500">${kcal.toLocaleString('pt-BR')} kcal no plano · ${feitas} de ${n} registradas</div>
          <div class="medio">${prot}<small style="color:var(--sec)"> g</small></div></div>
        <div class="barra"><i style="width:${Math.min(100, prot / meta * 100)}%"></i>${piso ? `<b style="left:${Math.min(100, piso / meta * 100)}%"></b>` : ''}</div>
        <div class="legenda" style="color:var(--sec);font-weight:600"><span>0</span><span>${piso ? 'risco: piso de ' + piso + ' g' : ''}</span><span>meta ${meta} g</span></div>
      </div></section>`;
  }

  h += `<section class="bloco"><a class="botao" href="#reg">Registrar ${ico('mais')}</a></section>`;

  if (regs.length) {
    const ordem = { 'Café': 0, 'Almoço': 1, 'Lanche': 2, 'Jantar': 3, 'Outro': 4 };
    regs.sort((a, b) => (ordem[a.refeicao] ?? 9) - (ordem[b.refeicao] ?? 9));
    h += `<section class="bloco"><div class="cab"><h2>Registrado</h2><small>${regs.length} ${regs.length === 1 ? 'item' : 'itens'}</small></div>` +
      regs.map(x => `<div class="linha"><span class="hora" style="font-size:14px">${esc(x.tipo === 'Refeição' ? (x.refeicao || 'Refeição') : x.tipo)}</span>
        <span class="corpo" style="font-weight:500">${esc(x.texto || (x.foto ? 'só a foto' : 'sem texto'))}${x.foto ? '<small>com foto</small>' : ''}</span></div>`).join('') + `</section>`;
  }

  if (r.janta && r.janta.receita && DATA.receitas && DATA.receitas[r.janta.receita]) {
    const rec = DATA.receitas[r.janta.receita];
    h += `<section class="bloco"><div class="cab"><h2>Receita da janta</h2><small>${T(rec.tempo)}</small></div>
      <details><summary>${T(rec.nome)}</summary><div class="miolo">
        <div class="par"><b>Rende:</b> ${T(rec.rende)} · ${rec.kcal} kcal · ${rec.prot} g</div>
        <div class="cat">Ingredientes</div>${rec.ingredientes.map(i => `<div class="par">${T(i)}</div>`).join('')}
        <div class="cat">Modo de fazer</div>${rec.passos.map((p, i) => `<div class="par"><b>${i + 1}.</b> ${T(p)}</div>`).join('')}
      </div></details></section>`;
  }
  $("view").innerHTML = h;
  document.querySelectorAll('button.refeicao').forEach(b => b.addEventListener('click', () => {
    const nota = document.getElementById('nota-' + b.dataset.n); if (!nota) return;
    nota.hidden = !nota.hidden; b.setAttribute('aria-expanded', String(!nota.hidden));
  }));
}

// ───────── início: a situação geral ─────────
// Os números vêm do fatos.json, publicado toda manhã — os do plano da semana envelhecem em dois dias.
function quadroAgora() {
  const f = FATOS || {}, rc = f.recuperacao || {}, ps = f.peso || {}, t = DATA.tendencias || {};
  const ult = ps.ultima, idx = rc.indice_hoje ?? t.indice_agudo_hoje, gar = rc.prontidao_garmin_hoje ?? t.prontidao_garmin_hoje;
  const cel = (k, v, un, d) => `<div><div class="k">${k}</div><div class="medio">${v}<small style="color:var(--sec)"> ${un}</small></div><div class="d">${d}</div></div>`;
  return `<section class="bloco"><div class="cab"><h2>Agora</h2><small>${f.gerado_em ? 'dados de ' + esc(f.gerado_em.slice(8, 10) + '/' + f.gerado_em.slice(5, 7) + ' às ' + f.gerado_em.slice(11, 16)) : 'do plano da semana'}</small></div>
    <div class="quad">
      ${cel('Peso', fNum(ps.media_7_neutras_de_verdade ?? DATA.peso_atual, 1), 'kg', ult ? 'média neutra · última: ' + fNum(ult.peso_kg, 1) + ' em ' + ult.data.slice(8, 10) + '/' + ult.data.slice(5, 7) + (ult.pos_esforco ? ' (pós-jogo)' : '') : 'média neutra')}
      ${cel('Prontidão Garmin', gar ?? '—', '', 'média de 7 dias: ' + (t.prontidao_media_7d ?? '—'))}
      ${cel('Índice próprio', idx ?? '—', '', rc.indice_hoje_confiavel === false ? 'faltou dado do relógio: use a média, ' + (rc.indice_medio_7d ?? '—') : 'média de 7 dias: ' + (rc.indice_medio_7d ?? t.indice_medio_7d ?? '—'))}
      ${rc.sono_ultima_noite_h != null
        ? cel('Sono desta noite', fNum(rc.sono_ultima_noite_h, 1), 'h', (rc.sono_ultima_noite_score != null ? 'score ' + rc.sono_ultima_noite_score + ' · ' : '') + 'média de 7 noites: ' + fNum(rc.sono_medio_7d, 1) + ' h')
        : cel('Sono', '—', '', 'o relógio ainda não enviou a noite · média de 7: ' + fNum(rc.sono_medio_7d ?? t.sono_media_7d, 1) + ' h')}
    </div>
    ${(f.lacunas || []).length ? `<div class="aviso" style="margin-top:0;border-top:0">Falta: ${esc(f.lacunas.join(' · '))}</div>` : ''}</section>`;
}
function blocoHoje() {
  const d = DATA.dias.find(x => x.data === hojeDDMM());
  if (!d) return `<section class="bloco"><div class="cab"><h2>Hoje</h2></div><div class="aviso" style="margin-top:0;border-top:0">O plano publicado não cobre o dia de hoje. A semana nova entra depois do conselho de domingo.</div></section>`;
  const f = partirFoco((d.treino && d.treino.foco) || 'Dia livre'), r = d.refeicoes || {};
  const prot = SLOTS.reduce((a, [k]) => a + ((r[k] && r[k].prot) || 0), 0);
  return `<section class="bloco"><div class="cab"><h2>Hoje</h2><small>${esc(d.nome)} · ${esc(d.data)}</small></div>
    <a class="linha" href="#hoje">${glifo(d)}<span class="corpo">${esc(f.titulo)}<small>${esc(f.sub || 'toque para abrir o dia')}</small></span><span class="num">${prot}<small> g</small></span></a></section>`;
}
function blocoDestino() {
  if (!DASH) return '';
  const P = DASH.peso, V = DASH.vo2max, prog = Math.max(0, Math.min(1, P.progresso || 0));
  return `<section class="bloco"><div class="cab"><h2>Destino</h2><small>${fNum(P.alvo, 0)} kg e VO₂ máx ${fNum(V.alvo[0], 0)}–${fNum(V.alvo[1], 0)}</small></div>
    <a class="linha" href="#evo"><span class="corpo">Peso<small>faltam ${fNum(P.atual_media_neutra - P.alvo, 1)} kg · ${P.ritmo_kg_semana_28d > 0 ? '+' : ''}${fNum(P.ritmo_kg_semana_28d, 2)} kg por semana</small></span><span class="medio">${fNum(P.atual_media_neutra, 1)}<small style="color:var(--sec)"> kg</small></span></a>
    <div style="padding:12px 0 6px;border-bottom:1px solid var(--fraca)"><div class="regua"><div class="eixo"></div>${REGUA_RISCOS}<div class="marca" style="left:${prog * 100}%"></div></div>
      <div class="legenda"><span>${fNum(P.partida, 1)} partida</span><span>${Math.round(prog * 100)}% do caminho</span><span>${fNum(P.alvo, 0)} meta</span></div></div>
    <a class="linha" href="#evo"><span class="corpo">VO₂ máx<small>meta ${fNum(V.alvo[0], 0)}–${fNum(V.alvo[1], 0)} · só o peso já leva a ${fNum(V.so_pelo_peso, 1)}</small></span><span class="medio">${fNum(V.referencia_nivel_do_mar, 1)}</span></a>
    <a class="botao claro" href="#evo" style="margin-top:14px">Abrir a evolução completa</a></section>`;
}
function blocoEspecialistas() {
  const R = DATA.relatorios || []; if (!R.length) return '';
  return `<section class="bloco"><div class="cab"><h2>Os especialistas</h2><small>como está e para onde vai</small></div>` +
    R.map((r, i) => `<details class="rel" ${i === 0 ? 'open' : ''}><summary><span class="corpo">${esc(r.especialista)}<small>${esc(r.assina || '')}</small></span></summary>
      <div class="miolo"><div class="cat" style="padding-top:4px">Como está</div><div class="par">${esc(r.como_esta)}</div>
        <div class="cat">Para onde vai</div><div class="par">${esc(r.para_onde)}</div>
        ${(r.nao_sei || []).length ? `<div class="cat">O que eu não sei</div>${r.nao_sei.map(x => `<div class="par" style="color:var(--sec)">${esc(x)}</div>`).join('')}` : ''}</div></details>`).join('') + `</section>`;
}
function blocoCardapio() {
  const largo = matchMedia('(min-width: 720px)').matches, hoje = hojeDDMM();
  const dias = DATA.dias.map(d => {
    const r = d.refeicoes || {}; let kcal = 0, prot = 0;
    const linhas = SLOTS.map(([chave, rot]) => { const m = r[chave]; if (!m) return '';
      kcal += m.kcal || 0; prot += m.prot || 0;
      let nome = semEmoji(m.nome), hora = rot;
      const t = nome.match(/^(~?\d{1,2}h\d{0,2}|\d{1,2}:\d{2})\s*·\s*/);
      if (t) { hora = t[1]; nome = nome.slice(t[0].length); }
      return `<div class="crow"><span class="slot">${esc(hora)}</span><span class="oque">${esc(nome)}</span><span class="g">${m.prot} g</span></div>`; }).join('');
    if (!linhas) return '';
    return `<details class="cdia ${d.data === hoje ? 'hoje' : ''}" ${largo || d.data === hoje ? 'open' : ''}>
      <summary><span class="hora">${esc(d.nome.slice(0, 3))} ${esc(d.data.slice(0, 2))}</span><span class="corpo">${kcal.toLocaleString('pt-BR')} kcal · ${prot} g de proteína<small>${esc(partirFoco((d.treino && d.treino.foco) || '').titulo)}</small></span></summary>
      <div class="miolo">${linhas}<a href="#${d.id}" style="display:inline-block;padding:8px 0 0;font-size:13.5px;font-weight:700">abrir o dia inteiro</a></div></details>`; }).join('');
  if (!dias) return '';
  return `<section class="bloco"><div class="cab"><h2>Cardápio da semana</h2><small>meta: ${DATA.dieta.calorias.toLocaleString('pt-BR')} kcal · ${DATA.dieta.proteina} g</small></div>
    <div class="cardapio">${dias}</div></section>`;
}
function renderInicio() {
  const partes = semEmoji(DATA.semana).split(/\s+·\s+/);
  const t = DATA.tendencias || {}, st = DATA.status_treino || {}, marcados = JSON.parse(localStorage.getItem('compras') || '{}');
  let h = `<div class="campo tinta"><div class="dentro" style="padding-bottom:22px">
    <div class="topo"><div class="rot">Semana · ${esc(partes[0])}</div><div class="selo">${fNum(DATA.peso_atual, 1)} kg</div></div>
    <h1 class="titulo longo">${esc((t0 => t0.charAt(0).toUpperCase() + t0.slice(1))(frase(partes.slice(1).join(' · ') || partes[0])))}</h1>
    <div class="sub">${T(DATA.objetivo)}</div></div></div>`;

  h += quadroAgora() + blocoEspecialistas() + blocoHoje() + blocoCardapio() + blocoDestino();
  const dias = `<section class="bloco"><div class="cab"><h2>Os dias</h2><small>${st.feito ?? 0} de ${st.planejado ?? '—'} treinos</small></div>` +
    DATA.dias.map(d => { const f = partirFoco((d.treino && d.treino.foco) || d.cardio || 'Dia livre');
      return `<a class="linha" href="#${d.id}">${glifo(d)}<span class="corpo">${esc(f.titulo)}<small>${esc(d.nome)} · ${esc(d.data)}${d.data === hojeDDMM() ? ' · hoje' : ''}</small></span></a>`; }).join('') +
    ((st.dias_feitos || []).length ? `<div class="aviso">${st.dias_feitos.map(T).join(' ')}</div>` : '') +
    `<div class="aviso" style="${(st.dias_feitos || []).length ? 'margin-top:0;border-top:0;padding-top:0' : ''}">Meta da semana: ${DATA.dieta.calorias.toLocaleString('pt-BR')} kcal e ${DATA.dieta.proteina} g de proteína por dia${DATA.dieta.proteina_piso ? ', com piso de ' + DATA.dieta.proteina_piso + ' g' : ''}.</div></section>`;

  const pr = t.prontidao || [];
  h += `<section class="bloco"><div class="cab"><h2>Prontidão</h2><small>${T(t.training_status || '')}</small></div>
    ${pr.length ? `<div class="pront">${pr.map((p, i) => `<div class="pcol"><div class="pval">${p.valor ?? '—'}</div>
        <div class="ptrilho"><i style="height:${Math.max(2, Math.min(100, p.valor || 0))}%;animation-delay:${(i * 0.05).toFixed(2)}s"></i>${p.meu != null ? `<b style="bottom:calc(${Math.max(0, Math.min(100, p.meu))}% - 1px)"></b>` : ''}</div>
        <div class="pdia">${esc(p.data)}</div></div>`).join('')}</div>
      <div class="legenda" style="color:var(--sec);font-weight:600;padding-top:10px"><span>barra e número: Garmin</span><span>traço: índice próprio</span></div>` : ''}
    <div class="linha"><span class="corpo">Garmin hoje<small>média de 7 dias: ${t.prontidao_media_7d ?? '—'}</small></span><span class="medio">${t.prontidao_garmin_hoje ?? '—'}</span></div>
    <div class="linha"><span class="corpo">Índice próprio hoje<small>média de 7 dias: ${t.indice_medio_7d ?? '—'}</small></span><span class="medio">${t.indice_agudo_hoje ?? '—'}</span></div>
    <div class="linha"><span class="corpo">Sono<small>média de 7 dias</small></span><span class="medio">${fNum(t.sono_media_7d, 1)}<small style="color:var(--sec)"> h</small></span></div></section>`;

  h += dias;
  if (DATA.relatorio && DATA.relatorio.length) h += `<section class="bloco"><div class="cab"><h2>Relatório</h2><small>${DATA.relatorio.length} pontos</small></div>
    <div class="par">${T(DATA.relatorio[0])}</div>
    ${DATA.relatorio.length > 1 ? `<details><summary>Ler o resto</summary><div class="miolo">${DATA.relatorio.slice(1).map(p => `<div class="par">${T(p)}</div>`).join('')}</div></details>` : ''}</section>`;

  if (DATA.regra_prato) h += `<section class="bloco"><div class="cab"><h2>As regras</h2></div>` +
    DATA.regra_prato.linhas.map((l, i) => `<div class="linha" style="align-items:flex-start"><span class="hora">${i + 1}</span><span class="corpo" style="font-weight:500">${T(l.replace(/^\s*[0-9]️?⃣\s*/, ''))}</span></div>`).join('') + `</section>`;

  if (DATA.lista_compra && DATA.lista_compra.length) h += `<section class="bloco compra"><div class="cab"><h2>Compras</h2><small>fica marcado neste aparelho</small></div>` +
    DATA.lista_compra.map((c, ci) => `<div class="cat">${T(c.cat)}</div>` + c.itens.map((it, ii) => { const k = ci + ':' + ii + ':' + semEmoji(it).slice(0, 24);
      return `<label><input type="checkbox" data-k="${esc(k)}" ${marcados[k] ? 'checked' : ''}><span>${T(it)}</span></label>`; }).join('')).join('') + `</section>`;

function resizeImage(dataUrl, maxDim, quality, cb) {
  const im = new Image();
  im.onload = () => {
    let w = im.width, h = im.height;
    if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
    else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', quality));
  };
  im.src = dataUrl;
}

    return true;
  } catch (e) {
    st.className = 'status err'; st.textContent = 'Falha de rede: ' + e;
    return false;
  }
}
function renderListaRegistros() {
  const corte = diasAtras(RFILTRO);
  const itens = (REGISTROS || []).filter((x) => x.data >= corte);
  const chips = [3, 7, 30].map((n) => `<button data-dias="${n}" class="${RFILTRO === n ? 'on' : ''}">${n} dias</button>`).join('');
  if (!itens.length) return `<div class="rdays">${chips}</div><div class="aviso">Nenhum registro nos últimos ${RFILTRO} dias.</div>`;
  const linhas = itens.map((x) => {
    const rotulo = x.tipo === 'Refeição' ? (x.refeicao || 'Refeição') : x.tipo;
    const marcas = [x.foto ? 'foto' : '', x.processado ? 'lido' : 'na fila'].filter(Boolean).join(' · ');
    if (EDIT_ID === x.id) {
      const opts = REFS.map((r) => `<option${r === x.refeicao ? ' selected' : ''}>${r}</option>`).join('');
      return `<div class="ritem editing" data-id="${x.id}">
        <div class="rhead"><span class="rd">Corrigindo ${esc(rotulo)}</span><span class="rk">${marcas}</span></div>
        <div class="redit">
          <div><label>Data</label><input type="date" class="e-data" value="${x.data}"></div>
          ${x.tipo === 'Refeição' ? `<div><label>Refeição</label><select class="e-ref">${opts}</select></div>` : ''}
          <div><label>Texto</label><textarea class="e-txt">${esc(x.texto || '')}</textarea></div>
          <div class="ract"><button class="e-save cheio">Salvar</button><button class="e-cancel">Cancelar</button></div>
        </div></div>`;
    }
    return `<div class="ritem" data-id="${x.id}">
      <div class="rhead"><span class="rd">${esc(rotulo)} · ${rotuloData(x.data)}</span><span class="rk">${marcas}</span></div>
      ${x.texto ? `<div class="rtxt">${esc(x.texto.slice(0, 160))}${x.texto.length > 160 ? '…' : ''}</div>`
                : `<div class="rtxt">sem texto${x.foto ? ', só a foto' : ''}</div>`}
      <div class="ract"><button class="r-edit">Corrigir</button><button class="r-del">Excluir</button></div>
    </div>`;
  }).join('');
  return `<div class="rdays">${chips}</div><div class="rlist">${linhas}</div>`;
}
function ligarListaRegistros() {
  const st = document.getElementById('rg-status');
  document.querySelectorAll('.rdays button').forEach((b) =>
    b.addEventListener('click', () => { RFILTRO = +b.dataset.dias; EDIT_ID = null; renderReg(); }));
  document.querySelectorAll('.ritem').forEach((el) => {
    const id = el.dataset.id;
    el.querySelector('.r-edit')?.addEventListener('click', () => { EDIT_ID = id; renderReg(); });
    el.querySelector('.r-del')?.addEventListener('click', () => {
      if (!confirm('Excluir este registro?\n\nEle vai pra lixeira do Notion — dá pra recuperar por 30 dias.')) return;
      el.querySelectorAll('button').forEach((b) => b.disabled = true);
      acaoRegistro(id, 'DELETE', null, st);
    });
    el.querySelector('.e-cancel')?.addEventListener('click', () => { EDIT_ID = null; renderReg(); });
    el.querySelector('.e-save')?.addEventListener('click', () => {
      const corpo = { data: el.querySelector('.e-data').value, texto: el.querySelector('.e-txt').value.trim() };
      const ref = el.querySelector('.e-ref');
      if (ref) corpo.refeicao = ref.value;
      if (!corpo.data) { st.className = 'status err'; st.textContent = 'Escolha uma data.'; return; }
      el.querySelectorAll('button').forEach((b) => b.disabled = true);
      acaoRegistro(id, 'PATCH', corpo, st);
    });
  });
}
function renderReg() {
  const tipo = REG_TIPO, treino = tipo === 'treino', obs = tipo === 'observacao', corrigir = tipo === 'corrigir';
  const label = treino ? 'treino' : obs ? 'observação' : 'refeição';
  const abas = `<div class="seg">
      <button id="tab-ref" class="${tipo === 'refeicao' ? 'on' : ''}">Refeição</button>
      <button id="tab-tre" class="${treino ? 'on' : ''}">Treino</button>
      <button id="tab-obs" class="${obs ? 'on' : ''}">Nota</button>
      <button id="tab-fix" class="${corrigir ? 'on' : ''}">Corrigir</button></div>`;
  const topo = `<div class="campo tinta"><div class="dentro" style="padding-bottom:22px">
    <div class="topo"><div class="rot">${corrigir ? 'Últimos registros' : 'Vai cru para o diário'}</div></div>
    <h1 class="titulo">${corrigir ? 'Corrigir' : 'Registrar'}</h1></div></div>`;
  const ligarAbas = () => {
    document.getElementById('tab-ref').addEventListener('click', () => { REG_TIPO = 'refeicao'; EDIT_ID = null; PHOTO_DATA = null; renderReg(); });
    document.getElementById('tab-tre').addEventListener('click', () => { REG_TIPO = 'treino'; EDIT_ID = null; PHOTO_DATA = null; renderReg(); });
    document.getElementById('tab-obs').addEventListener('click', () => { REG_TIPO = 'observacao'; EDIT_ID = null; PHOTO_DATA = null; renderReg(); });
    document.getElementById('tab-fix').addEventListener('click', () => { REG_TIPO = 'corrigir'; PHOTO_DATA = null; EDIT_ID = null; renderReg(); });
  };
  if (corrigir) {
    $("view").innerHTML = topo + `<section class="bloco" style="padding-top:8px">${abas}${renderListaRegistros()}
      <div id="rg-status" class="status" style="margin-top:12px"></div>
      <div class="aviso">Mudar a data devolve o registro para a fila: eu releio na próxima análise, porque a leitura anterior estava no dia errado. Excluir manda para a lixeira do Notion, recuperável por 30 dias.</div></section>`;
    ligarAbas(); ligarListaRegistros();
    return;
  }
  $("view").innerHTML = topo + `<section class="bloco" style="padding-top:8px">${abas}
    <div class="form">
      ${tipo === 'refeicao' ? `<div><label for="rg-ref">Refeição</label><select id="rg-ref">
        <option>Café</option><option selected>Almoço</option><option>Jantar</option><option>Lanche</option><option>Outro</option></select></div>` : ''}
      <div><label for="rg-data">Data</label><input type="date" id="rg-data"></div>
      <div><label for="rg-txt">${treino ? 'Notas (opcional)' : obs ? 'Observação' : 'O que comeu'}</label>
        <textarea id="rg-txt" placeholder="${treino ? 'ex.: Lower A, RPE 7, tornozelo ok' : obs ? 'ex.: dor no ombro direito ao levantar peso, começou hoje' : 'ex.: 150 g de frango grelhado, arroz, salada'}"></textarea></div>
      <div><label>${treino ? 'Screenshot do treino (Fitbod)' : obs ? 'Foto (opcional)' : 'Foto do prato ou do rótulo (opcional)'}</label><div class="photo">
        <label class="filebtn">${treino ? 'Anexar screenshot' : 'Tirar ou escolher foto'}<input type="file" id="rg-foto" accept="image/*"></label>
        <img id="rg-prev" alt=""></div></div>
      <button class="botao" id="rg-send">Registrar ${label} ${ico('mais')}</button>
      <div id="rg-status" class="status"></div>
      <div class="aviso">${treino ? 'Sem análise agora: a screenshot vai crua. No fechamento da semana eu extraio exercícios, séries e carga.' : obs ? 'Sem análise agora: fica na caixa bruta para eu considerar no próximo resumo.' : 'Sem análise agora: vai cru para a caixa. No fechamento da semana eu leio tudo.'}</div>
    </div></section>`;
  document.getElementById('rg-data').value = isoLocal();
  document.getElementById('rg-foto').addEventListener('change', previewPhoto);
  document.getElementById('rg-send').addEventListener('click', submitLog);
  ligarAbas();
}

// ───────── rotas ─────────
function route() {
  const id = (location.hash || '#home').slice(1);
  if (id === 'reg') { renderNav('reg'); renderReg(); window.scrollTo(0, 0); return; }
  if (id === 'evo') { renderNav('evo'); renderEvo(); window.scrollTo(0, 0); return; }
  const hoje = DATA.dias.find(d => d.data === hojeDDMM());
  const dia = id === 'hoje' ? (hoje || DATA.dias[DATA.dias.length - 1]) : DATA.dias.find(d => d.id === id);
  if (dia) { renderNav('hoje'); renderDia(dia, dia === hoje); window.scrollTo(0, 0); return; }
  renderNav('home'); renderInicio(); window.scrollTo(0, 0);   // '#home', '#semana' e qualquer endereço antigo
}
// Celular deixa a página aberta em segundo plano por dias. Ao voltar depois de 10 min, recarrega:
// é o que garante plano, números e a própria página sempre da última publicação.
let SAIU_EM = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { SAIU_EM = Date.now(); return; }
  if (SAIU_EM && Date.now() - SAIU_EM > 10 * 60 * 1000 && !document.querySelector('#rg-txt')?.value) location.reload();
});

fetch("data/semana.json").then(r => r.json()).then(d => {
  DATA = d;
  window.addEventListener("hashchange", route);
  route();
  // Tudo que chega depois redesenha a tela, menos o formulário (para não apagar o que está sendo digitado).
  const redesenha = () => { const id = (location.hash || '#home').slice(1); if (id !== 'reg' && id !== 'evo') route(); };
  fetch("data/fatos.json").then(r => r.ok ? r.json() : null).then(f => { FATOS = f; if (f) redesenha(); }).catch(() => {});
  fetch("data/dashboard.json").then(r => r.ok ? r.json() : null).then(x => { if (x) { DASH = x; redesenha(); } }).catch(() => {});
  fetch("/api/registros").then(r => r.ok ? r.json() : { items: [] }).then(j => {
    REGISTROS = j.items || [];
    redesenha();   // as boias dependem dos registros
  }).catch(() => {});
});
</script>
